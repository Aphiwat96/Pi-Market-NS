<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ - Pi Market-NS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
    
    :root {
      --pi-purple: #6B21A8;
      --pi-green: #22D381;
    }
    
    .top-bar{
      background:linear-gradient(135deg, var(--pi-purple), var(--pi-green));
      color:#FFF;padding:16px;
      display:flex;align-items:center;gap:12px;
    }
    .back{color:#FFF;text-decoration:none;font-size:20px;}
    .title{font-size:18px;font-weight:bold;}
    
    .content{
      background:#FFF;min-height:calc(100vh - 60px);
      padding:24px 16px 100px;
    }
    
    .card{
      background:linear-gradient(135deg, var(--pi-purple), var(--pi-green));
      border-radius:20px;padding:32px 20px;
      text-align:center;color:#FFF;margin-bottom:24px;
    }
    .avatar{
      width:80px;height:80px;
      background:rgba(255,255,255,0.25);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:36px;margin:0 auto 12px;
    }
    .pid{font-size:14px;opacity:0.8;margin-top:4px;}
    .role{
      display:inline-block;margin-top:12px;
      padding:6px 16px;background:rgba(255,255,255,0.2);
      border-radius:20px;font-size:13px;
    }
    
    .menu-item{
      display:flex;align-items:center;justify-content:space-between;
      padding:16px;border-bottom:1px solid #F0F0F0;
      color:#333;text-decoration:none;font-size:15px;
    }
    .menu-icon{font-size:18px;margin-right:12px;}
    .arrow{color:#CCC;}
    
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(0,0,0,0.75);
      display:flex;justify-content:space-around;
      padding:10px 0 16px;
      border-top:1px solid rgba(255,255,255,0.1);
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      color:#FFF;text-decoration:none;
    }
    .nav-item .icon{font-size:24px;}
    .nav-item.profile{transform:scale(1.15);}
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back">←</a>
    <h1 class="title">โปรไฟล์</h1>
  </div>

  <div class="content">
    <div class="card">
      <div class="avatar">👤</div>
      <h2 id="pName">สมาชิก Pi Market-NS</h2>
      <p class="pid" id="pPID">PM-XXXXXXXX</p>
      <span class="role" id="pRole">สมาชิกทั่วไป</span>
    </div>

    <a href="#" class="menu-item">
      <div style="display:flex;align-items:center;">
        <span class="menu-icon">📋</span><span>ข้อมูลบัญชี</span>
      </div><span class="arrow">›</span>
    </a>
    <a href="#" class="menu-item">
      <div style="display:flex;align-items:center;">
        <span class="menu-icon">🛍️</span><span>คำสั่งซื้อของฉัน</span>
      </div><span class="arrow">›</span>
    </a>
    <a href="#" class="menu-item">
      <div style="display:flex;align-items:center;">
        <span class="menu-icon">💳</span><span>การชำระเงิน</span>
      </div><span class="arrow">›</span>
    </a>
    <a href="#" class="menu-item">
      <div style="display:flex;align-items:center;">
        <span class="menu-icon">🏪</span><span>จัดการร้านค้า</span>
      </div><span class="arrow">›</span>
    </a>
    <a href="#" class="menu-item" onclick="localStorage.removeItem('pi_market_ns_user');alert('ออกจากระบบแล้ว');location.href='index.html';">
      <div style="display:flex;align-items:center;">
        <span class="menu-icon">🔒</span><span>ออกจากระบบ</span>
      </div><span class="arrow">›</span>
    </a>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span><span>หน้าแรก</span>
    </a>
    <a href="cart.html" class="nav-item">
      <span class="icon">🛒</span><span>ตะกร้า</span>
    </a>
    <a href="notifications.html" class="nav-item">
      <span class="icon">🔔</span><span>แจ้งเตือน</span>
    </a>
    <a href="profile.html" class="nav-item profile">
      <span class="icon">👤</span><span>โปรไฟล์</span>
    </a>
  </nav>

  <script>
    window.addEventListener('load', () => {
      const saved = localStorage.getItem('pi_market_ns_user');
      if (saved) {
        const u = JSON.parse(saved);
        document.getElementById('pName').textContent = u.username;
        document.getElementById('pPID').textContent = u.accountId;
        document.getElementById('pRole').textContent = 
          u.role === 'founder' ? 'ผู้ก่อตั้ง' :
          u.role === 'admin' ? 'ผู้ดูแลระบบ' :
          u.role === 'vendor' ? 'ผู้ขาย' : 'สมาชิกทั่วไป';
      }
    });
  </script>
</body>
</html>
