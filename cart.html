<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ตะกร้าสินค้า - Pi Market-NS</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}
    
    :root {
      --pi-purple: #6B21A8;
      --pi-green: #22D381;
    }
    
    .top-bar{
      background:linear-gradient(135deg, var(--pi-purple), var(--pi-green));
      color:#FFF;padding:16px;
      display:flex;align-items:center;gap:12px;
    }
    .back{color:#FFF;text-decoration:none;font-size:20px;}
    .title{font-size:18px;font-weight:bold;}
    
    .content{
      background:#FFF;min-height:calc(100vh - 60px);
      padding:24px 16px 100px;
    }
    
    .empty{text-align:center;padding:60px 20px;color:#777;}
    .empty-icon{font-size:64px;margin-bottom:16px;opacity:0.6;}
    .btn{
      display:block;width:100%;padding:14px;
      background:linear-gradient(135deg, var(--pi-purple), var(--pi-green));
      color:#FFF;text-align:center;text-decoration:none;
      border-radius:12px;font-weight:bold;transition:0.2s;
    }
    .btn:active{opacity:0.9;}
    
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;
      background:rgba(0,0,0,0.75);
      display:flex;justify-content:space-around;
      padding:10px 0 16px;
      border-top:1px solid rgba(255,255,255,0.1);
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;gap:4px;
      color:#FFF;text-decoration:none;
    }
    .nav-item .icon{font-size:24px;}
    .nav-item.cart{transform:scale(1.15);}
  </style>
</head>
<body>

  <div class="top-bar">
    <a href="index.html" class="back">←</a>
    <h1 class="title">ตะกร้าสินค้า</h1>
  </div>

  <div class="content">
    <div class="empty">
      <div class="empty-icon">🛒</div>
      <p style="font-size:16px;margin-bottom:8px;">ตะกร้าของคุณยังไม่มีสินค้า</p>
      <p style="color:#999;margin-bottom:24px;">กลับไปเลือกสินค้าที่หน้าแรก หรือเข้าสู่ระบบเพื่อเริ่มช้อปปิ้ง</p>
      <a href="index.html" class="btn">กลับไปช้อปปิ้ง</a>
    </div>
  </div>

  <nav class="bottom-nav">
    <a href="index.html" class="nav-item">
      <span class="icon">🏠</span><span>หน้าแรก</span>
    </a>
    <a href="cart.html" class="nav-item cart">
      <span class="icon">🛒</span><span>ตะกร้า</span>
    </a>
    <a href="notifications.html" class="nav-item">
      <span class="icon">🔔</span><span>แจ้งเตือน</span>
    </a>
    <a href="profile.html" class="nav-item">
      <span class="icon">👤</span><span>โปรไฟล์</span>
    </a>
  </nav>

</body>
</html>
