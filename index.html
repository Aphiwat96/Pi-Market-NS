<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pi Market-NS</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">π</div>
        <span>Pi Market-NS</span>
      </div>
      <button class="icon-btn">🔔</button>
    </header>

    <main class="content">
      <section class="welcome">
        <h1>ยินดีต้อนรับสู่ Pi Market-NS</h1>
        <p>ตลาดซื้อขายสินค้าในระบบ Pi Ecosystem</p>
      </section>

      <input type="text" class="search" placeholder="ค้นหาสินค้า...">

      <section class="section">
        <h2 class="sec-title">หมวดหมู่สินค้า</h2>
        <div class="cat-grid">
          <button class="cat">สินค้าชุมชน</button>
          <button class="cat">การเกษตร</button>
          <button class="cat">อิเล็กทรอนิกส์</button>
          <button class="cat">เสื้อผ้า-แฟชั่น</button>
        </div>
      </section>

      <section class="section">
        <h2 class="sec-title">สินค้าแนะนำ</h2>
        <div class="prod-grid">
          <div class="prod-card">
            <div class="prod-img">📦</div>
            <div class="prod-name">สินค้าตัวอย่าง</div>
            <div class="prod-price">π 10</div>
          </div>
          <div class="prod-card">
            <div class="prod-img">🌿</div>
            <div class="prod-name">สินค้าชุมชน</div>
            <div class="prod-price">π 15</div>
          </div>
        </div>
      </section>
    </main>

    <nav class="bottom-nav">
      <a class="nav-item active" href="#">⌂<br>หน้าแรก</a>
      <a class="nav-item" href="#">🛒<br>ตะกร้า</a>
      <a class="nav-item" href="#">💬<br>แชท</a>
      <a class="nav-item" href="#">👤<br>โปรไฟล์</a>
    </nav>
  </div>
</body>
</html>
